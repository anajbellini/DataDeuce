x-airflow-common: &airflow-common
  image: apache/airflow:3.3.2
  environment:
    - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    - AIRFLOW__CORE__AUTH_MANAGER=airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow_db_user:airflow_1234@airflow-postgres:5432/airflow
    - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW_FERNET_KEY:-}
    - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=false
    - AIRFLOW__CORE__LOAD_EXAMPLES=false
    - AIRFLOW__CORE__EXECUTION_API_SERVER_URL=http://airflow-apiserver:8080/execution/
    - AIRFLOW__API_AUTH__JWT_SECRET=local-dev-only-not-a-real-secret
    - AIRFLOW__API_AUTH__JWT_ISSUER=airflow
    - AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK=true
    - AIRFLOW_CONFIG=/opt/airflow/config/airflow.cfg
    - _AIRFLOW_WWW_USER_USERNAME=${_AIRFLOW_WWW_USER_USERNAME:-admin}
    - _AIRFLOW_WWW_USER_PASSWORD=${_AIRFLOW_WWW_USER_PASSWORD:-admin}
  volumes:
    - ./infra/airflow/dags:/opt/airflow/dags
    - ./infra/airflow/config:/opt/airflow/config
    - ./infra/airflow/plugins:/opt/airflow/plugins
    - airflow-logs:/opt/airflow/logs # named volume to be cleaned after down -v

services:
  airflow-postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=airflow_db_user
      - POSTGRES_PASSWORD=airflow_1234
      - POSTGRES_DB=airflow
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow_db_user", "-d", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    user: "0:0"
    command:
      - -c
      - |
        mkdir -p /opt/airflow/{dags,logs,plugins,config}
        /entrypoint airflow db migrate
        /entrypoint airflow users create \
          --username "$${_AIRFLOW_WWW_USER_USERNAME}" \
          --password "$${_AIRFLOW_WWW_USER_PASSWORD}" \
          --firstname Ana \
          --lastname Bellini \
          --role Admin \
          --email admin@example.com || true
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/{dags,logs,plugins,config}
    depends_on:
      airflow-postgres:
        condition: service_healthy

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    user: "${AIRFLOW_UID:-50000}:0"
    ports:
      - "8080:8080"
    healthcheck:
      test:
        ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    user: "${AIRFLOW_UID:-50000}:0"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    user: "${AIRFLOW_UID:-50000}:0"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    user: "${AIRFLOW_UID:-50000}:0"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  warehouse-postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=warehouse_db_user
      - POSTGRES_PASSWORD=warehouse_1234
      - POSTGRES_DB=warehouse
    volumes:
      - warehouse-postgres-data:/var/lib/postgresql/data
      # DDL/init scripts land in ./infra/postgres once the schema is defined
    ports:
      - "5433:5432" # other local port to avoid conflicts with airflow-postgres
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "warehouse_db_user", "-d", "warehouse"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

volumes:
  airflow-postgres-data:
  airflow-logs:
  warehouse-postgres-data:
