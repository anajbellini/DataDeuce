[project]
name = "data-deuce"
version = "0.1.0"
description = "Tennis data engineering portfolio project (Airflow + dbt)"
requires-python = ">=3.12"
dependencies = [
    "dbt-core==1.12.3",
    "dbt-postgres==1.11.0",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.4",
    "pre-commit>=4.6.2",
    "ruff>=0.16.8",
    "sqlfluff>=4.3.0",
    "yamllint>=1.38.0",
]
