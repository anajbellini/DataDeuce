[project]
name = "data-deuce"
version = "0.1.0"
description = "Tennis data engineering portfolio project (Airflow + dbt)"
requires-python = ">=3.12"
dependencies = [
    "dbt-core==1.12.3",
    "dbt-postgres==1.11.0",
    "pandas>=3.0.6",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.4",
    "pre-commit>=4.6.2",
    "pytest>=8.4.2",
    "ruff>=0.16.8",
    "sqlfluff>=4.3.0",
    "yamllint>=1.38.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint]
extend-select = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
